# ──────────────────────────────────────────────────────────────────
# CI Pipeline — runs on every push / PR to main
# Stages: Lint → Unit Test → Integration Test → Build Image
# Each stage depends (needs) on the previous one.
# ──────────────────────────────────────────────────────────────────
name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ──────────── Stage 1: Lint & Static Analysis ────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # — Python linting —
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Run flake8 (Python)
        run: flake8 app/ --max-line-length=120 --count --show-source --statistics

      - name: Check formatting with black
        run: black --check app/ || true

      # — Node.js linting —
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: ui

      - name: Run ESLint (React)
        run: npm run lint
        working-directory: ui

  # ──────────── Stage 2: Unit Tests ────────────────────────
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # — Python unit tests —
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest (unit tests)
        run: pytest tests/services/ tests/test_main.py tests/api/ -v --tb=short
        env:
          PYTHONPATH: .
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: mock-key
          SECRET_KEY: test-secret-key

      # — Node.js unit tests —
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: ui

      - name: Run Vitest (frontend tests)
        run: npm test
        working-directory: ui

  # ──────────── Stage 3: Integration Tests ─────────────────
  integration-test:
    name: Integration Tests
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          PYTHONPATH: .
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: mock-key
          SECRET_KEY: test-secret-key

  # ──────────── Stage 4: Build Docker Image ────────────────
  build-image:
    name: Build Docker Image
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build -t edustart-api:${{ github.sha }} .

      - name: Build UI Docker image
        run: docker build -t edustart-ui:${{ github.sha }} ./ui

      - name: Verify images built
        run: docker images | grep edustart
